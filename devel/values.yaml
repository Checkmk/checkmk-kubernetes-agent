# values.yaml overrides for the dev env (`just kind-dev`)
clusterName: kind
clusterHostName: kind
logLevel: warn,cluster_aggregator=debug,node_scraper=debug

nodeScraper:
  image:
    repository: checkmk-kubernetes-agent-node-scraper
    tag: local
  extraVolumes:
    - name: src
      hostPath:
        path: /src
  extraVolumeMounts:
    - name: src
      mountPath: /src

clusterAggregator:
  image:
    repository: checkmk-kubernetes-agent-cluster-aggregator
    tag: local

  service:
    type: NodePort
    nodePort: 30050

  extraVolumes:
    - name: src
      hostPath:
        path: /src

  extraVolumeMounts:
    - name: src
      mountPath: /src

push:
  enabled: false
  url: https://172.18.0.1:8000/heute
  # In devel we default this to true so that it's easier to set up against a dev
  # site. If you want to test validation, override this in custom_values.yaml
  # or pass a site CA file path through the `just` variable site_ca.
  insecureSkipSiteCaVerification: true

pull:
  enabled: true
  authentication:
    enabled: false

emitAll:
  pvcs: true
