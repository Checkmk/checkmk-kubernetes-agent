apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    {{- include "rustik.labels" . | nindent 4 }}
  name: {{ include "rustik.fullname" . }}-metrics-fetcher
spec:
  minReadySeconds: {{ .Values.metricsFetcher.minReadySeconds }}
  selector:
    matchLabels:
      app: {{ include "rustik.fullname" . }}-metrics-fetcher
  template:
    metadata:
      {{- with .Values.metricsFetcher.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "rustik.labels" . | nindent 8 }}
        {{- if .Values.gkeAutopilot.enabled }}
        cloud.google.com/matching-allowlist: {{ required "gkeAutopilot.matchingAllowlist must name an installed Rustik WorkloadAllowlist" .Values.gkeAutopilot.matchingAllowlist | quote }}
        {{- end }}
        app.kubernetes.io/component: metrics-fetcher
        app: {{ include "rustik.fullname" . }}-metrics-fetcher
        {{- with .Values.metricsFetcher.podLabels }}
        {{- toYaml (omit . "cloud.google.com/matching-allowlist" "app" "helm.sh/chart" "app.kubernetes.io/name" "app.kubernetes.io/instance" "app.kubernetes.io/version" "app.kubernetes.io/managed-by" "app.kubernetes.io/component") | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.metricsFetcher.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metricsFetcher.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metricsFetcher.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metricsFetcher.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      serviceAccountName: {{ include "rustik.serviceAccountName" (dict "root" . "component" "metrics-fetcher" "serviceAccount" .Values.metricsFetcher.serviceAccount) }}
      {{- with .Values.metricsFetcher.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.metricsFetcher.extraVolumes .Values.intraClusterCommunication.encryption.enabled .Values.metricsFetcher.networkInterfaceMonitoring.enabled }}
      volumes:
        {{- if .Values.metricsFetcher.networkInterfaceMonitoring.enabled }}
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        {{- end }}
        {{- with .Values.metricsFetcher.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.intraClusterCommunication.encryption.enabled }}
        - name: intra-cluster-ca
          secret:
            secretName: {{ include "rustik.intraClusterTLSSecretName" . }}
            items:
              - key: ca.crt
                path: intra-cluster-ca.crt
        {{- end }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metricsFetcher.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: metrics-fetcher
          image: {{ include "rustik.image" (dict "root" . "image" .Values.metricsFetcher.image) | quote }}
          imagePullPolicy: {{ .Values.metricsFetcher.image.pullPolicy }}
          {{- with .Values.metricsFetcher.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --kubelet-stats-poll-interval={{ .Values.metricsFetcher.kubeletStatsPollInterval }}
            - --kubelet-health-poll-interval={{ .Values.metricsFetcher.kubeletHealthPollInterval }}
            - --system-agent-poll-interval={{ .Values.metricsFetcher.systemAgentPollInterval }}
            - --system-agent-timeout={{ .Values.metricsFetcher.systemAgentTimeout }}
            - --metrics-cache-namespace={{ .Release.Namespace }}
            - --metrics-cache-service={{ include "rustik.fullname" . }}-metrics-cache-ingest
            - --metrics-cache-port={{ .Values.metricsCache.intraClusterPort }}
            {{- if .Values.intraClusterCommunication.encryption.enabled }}
            - --metrics-cache-ca-cert-file=/etc/ssl/certs/intra-cluster-ca.crt
            {{- end }}
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RUST_LOG
              value: {{ .Values.metricsFetcher.logLevel | default .Values.logLevel }}
          {{- if or .Values.metricsFetcher.extraVolumeMounts .Values.intraClusterCommunication.encryption.enabled .Values.metricsFetcher.networkInterfaceMonitoring.enabled }}
          volumeMounts:
            {{- if .Values.metricsFetcher.networkInterfaceMonitoring.enabled }}
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            {{- end }}
            {{- with .Values.metricsFetcher.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.intraClusterCommunication.encryption.enabled }}
            - name: intra-cluster-ca
              readOnly: true
              mountPath: /etc/ssl/certs/intra-cluster-ca.crt
              subPath: intra-cluster-ca.crt
            {{- end }}
          {{- end }}
          {{- with .Values.metricsFetcher.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
