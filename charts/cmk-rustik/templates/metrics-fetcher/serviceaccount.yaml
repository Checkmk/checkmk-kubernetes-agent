{{- if .Values.metricsFetcher.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- with .Values.metricsFetcher.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "rustik.labels" . | nindent 4 }}
  name: {{ include "rustik.serviceAccountName" (dict "root" . "component" "metrics-fetcher" "serviceAccount" .Values.metricsFetcher.serviceAccount) }}
{{- end }}
