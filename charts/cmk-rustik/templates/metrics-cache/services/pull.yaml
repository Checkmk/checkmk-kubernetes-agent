apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "rustik.labels" . | nindent 4 }}
  name: {{ include "rustik.fullname" . }}-metrics-cache-pull
  {{- with .Values.metricsCache.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.metricsCache.service.type }}
  selector:
    app: {{ include "rustik.fullname" . }}-metrics-cache
  ports:
    - name: pull
      port: {{ .Values.metricsCache.service.pullPort }}
      targetPort: pull
      {{- if eq .Values.metricsCache.service.type "NodePort" }}
      nodePort: {{ required "nodePort is required if service type is NodePort" .Values.metricsCache.service.nodePort }}
      {{- end }}
      protocol: TCP
