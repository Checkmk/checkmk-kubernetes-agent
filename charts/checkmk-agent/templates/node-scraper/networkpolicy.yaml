{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "checkmk-agent.fullname" . }}-node-scraper
  labels:
    {{- include "checkmk-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "checkmk-agent.fullname" . }}-node-scraper
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress: []
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: {{ include "checkmk-agent.fullname" . }}-cluster-aggregator
      ports:
        - protocol: TCP
          port: {{ .Values.clusterAggregator.intraClusterPort }}
    {{- with (concat .Values.networkPolicy.egress.commonRules .Values.networkPolicy.egress.nodeScraperRules) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
