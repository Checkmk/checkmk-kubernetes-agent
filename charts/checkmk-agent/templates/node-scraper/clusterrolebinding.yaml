apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "checkmk-agent.labels" . | nindent 4 }}
  name: {{ include "checkmk-agent.fullname" . }}-node-scraper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "checkmk-agent.fullname" . }}-node-scraper
subjects:
  - kind: ServiceAccount
    name: {{ include "checkmk-agent.serviceAccountName" (dict "root" . "component" "node-scraper" "serviceAccount" .Values.nodeScraper.serviceAccount) }}
    namespace: {{ .Release.Namespace }}
