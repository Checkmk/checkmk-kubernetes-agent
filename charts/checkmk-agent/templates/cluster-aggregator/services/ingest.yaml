apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "checkmk-agent.labels" . | nindent 4 }}
  name: {{ include "checkmk-agent.fullname" . }}-cluster-aggregator-ingest
  {{- with .Values.clusterAggregator.service.ingestAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "checkmk-agent.fullname" . }}-cluster-aggregator
  ports:
    - name: intra-cluster
      port: {{ .Values.clusterAggregator.service.intraClusterPort }}
      targetPort: intra-cluster
      protocol: TCP
