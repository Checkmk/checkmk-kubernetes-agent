---
name: Reusable helm chart release workflow

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: azure/setup-helm@v5.0.1
      - name: Log in to GHCR
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_PASSWORD" |
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin
      - name: Package and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # The packaged chart must use the images built in this repository,
          # including when testing the release workflow in a fork.
          sed -i "s|ghcr.io/checkmk/checkmk-kubernetes-agent-|ghcr.io/${GITHUB_REPOSITORY,,}-|g" \
            charts/checkmk-agent/values.yaml
          helm package charts/checkmk-agent \
            --version "$VERSION" \
            --app-version "sha-${{ github.sha }}"
          helm push "checkmk-agent-$VERSION.tgz" \
            oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts
